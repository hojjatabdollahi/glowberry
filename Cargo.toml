[package]
name = "glowberry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Enhanced background/wallpaper service with live shader support"
license.workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
color-eyre = "0.6.5"
colorgrad = { workspace = true }
glowberry-config = { path = "./config" }
glowberry-lib = { workspace = true }
eyre = "0.6.12"
fast_image_resize = { version = "6.0.0", features = ["image"] }
image = { workspace = true, features = ["hdr", "jpeg", "png", "rayon", "webp"] }
jxl-oxide = { version = "0.12.4", features = ["image"] }
notify = "8.2.0"
rand = "0.10"
sctk = { package = "smithay-client-toolkit", version = "0.20.0" }
tracing = { workspace = true }
tracing-subscriber = "0.3.20"
walkdir = "2.5"

[workspace]
members = ["config", "crates/glowberry-lib", "apps/glowberry-settings"]

[workspace.package]
version = "0.5.1"
edition = "2024"
rust-version = "1.93"
license = "MPL-2.0"

[workspace.dependencies]
colorgrad = "0.8 "
glowberry-lib = { path = "crates/glowberry-lib" }
image = { version = "0.25.6", default-features = false }
tracing = "0.1.41"

[dependencies.cosmic-config]
git = "https://github.com/pop-os/libcosmic"
features = ["calloop"]

[profile.release]
opt-level = 3

[package.metadata.deb]
maintainer = "Hojjat Abdollahi"
copyright = "2026, Hojjat Abdollahi"
license-file = ["LICENSE.md", "0"]
extended-description = """\
GlowBerry replaces cosmic-bg on the COSMIC desktop with a background service \
that can render live GPU shader wallpapers (WGSL) as well as static images, \
solid colors and gradients, with per-output configuration and power saving. \
After installing, run `glowberry-switch enable` (or use the settings app) to \
make cosmic-session start GlowBerry instead of cosmic-bg."""
depends = "$auto"
section = "utils"
priority = "optional"
assets = [
  [
    "target/release/glowberry",
    "usr/bin/",
    "755",
  ],
  [
    "target/release/glowberry-settings",
    "usr/bin/",
    "755",
  ],
  [
    "scripts/glowberry-switch",
    "usr/bin/",
    "755",
  ],
  [
    "data/io.github.hojjatabdollahi.glowberry.desktop",
    "usr/share/applications/",
    "644",
  ],
  [
    "apps/glowberry-settings/data/io.github.hojjatabdollahi.glowberry-settings.desktop",
    "usr/share/applications/",
    "644",
  ],
  [
    "data/io.github.hojjatabdollahi.glowberry.metainfo.xml",
    "usr/share/metainfo/",
    "644",
  ],
  [
    "data/icons/io.github.hojjatabdollahi.glowberry.svg",
    "usr/share/icons/hicolor/scalable/apps/",
    "644",
  ],
  [
    "data/icons/io.github.hojjatabdollahi.glowberry-symbolic.svg",
    "usr/share/icons/hicolor/symbolic/apps/",
    "644",
  ],
  [
    "apps/glowberry-settings/data/icons/io.github.hojjatabdollahi.glowberry-settings.svg",
    "usr/share/icons/hicolor/scalable/apps/",
    "644",
  ],
  [
    "apps/glowberry-settings/data/icons/io.github.hojjatabdollahi.glowberry-settings-symbolic.svg",
    "usr/share/icons/hicolor/symbolic/apps/",
    "644",
  ],
  [
    "examples/*.wgsl",
    "usr/share/glowberry/shaders/",
    "644",
  ],
  [
    "data/v1/*",
    "usr/share/cosmic/io.github.hojjatabdollahi.glowberry/v1/",
    "644",
  ],
]
